    <script>
      // Suppress benign Vite WebSocket/HMR disconnect errors in iframe preview environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason?.message).includes('WebSocket') || String(e.reason?.message).includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
